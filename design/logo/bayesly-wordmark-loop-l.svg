<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 86 779.328125 282">
<title>Bayesly wordmark (loop-l) — live text: outline before production use</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&amp;display=swap');text{font:700 200px 'Inter Tight',sans-serif;letter-spacing:-6px;fill:#0d0d0e}.loop{fill:none;stroke:#0d0d0e;stroke-width:32;stroke-linecap:butt;stroke-linejoin:round}</style>
