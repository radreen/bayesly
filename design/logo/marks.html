<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayesly marks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Sora:wght@600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0d0d0e; --lime: #c6ff2e; --paper: #e4e4df; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #9d9d98; font-family: "Inter Tight", system-ui, sans-serif; padding: 32px 40px 60px; }
  h1 { font: 800 28px "Inter Tight"; letter-spacing: -0.03em; }
  .note { font: 500 13px "JetBrains Mono", monospace; opacity: .75; margin: 6px 0 26px; }
  h3 { font: 700 13px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .1em; margin: 34px 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(780px, 1fr)); gap: 24px; }
  .variant h2 { font: 700 14px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .08em; }
  .variant p { font: 500 12px "JetBrains Mono", monospace; opacity: .75; margin: 3px 0 10px; }
  .row { display: flex; gap: 10px; }
  .tile { flex: none; width: 430px; height: 230px; display: grid; place-items: center; }
  .lime { background: var(--lime); color: var(--ink); }
  .ink { background: var(--ink); color: var(--white, #f5f5f0); }
  .paper { background: var(--paper); color: var(--ink); }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; }
  .avatar svg { width: 54%; height: 54%; }
  .tiny { display: flex; gap: 10px; align-items: center; padding: 10px; background: var(--paper); flex: 1; }
  .tiny .c { border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--ink); }
  .tiny svg { width: 56%; height: 56%; }

  /* Lockup: mark height ~ ascender height, tight gap, like the references */
  .lockup { display: flex; align-items: center; gap: .26em; font-size: 74px; line-height: 1; }
  .lockup svg { height: .80em; width: auto; flex: none; transform: translateY(-.02em); }
  .lockup .word { font-weight: 700; letter-spacing: -0.045em; }
  .lockup.sm { font-size: 30px; }

  .fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 10px; }
  .fonts .tile { width: auto; height: 150px; }
  .fonts .tile > div { text-align: center; }
  .fonts small { display: block; margin-top: 12px; font: 500 12px "JetBrains Mono", monospace; opacity: .6; }
</style>
</head>
<body>
<h1>Bayesly — marks v8 — built from your references</h1>
<p class="note">Symbol + clean wordmark, like Kimaro / Lumin / Offtop. Marks are built from circles, rectangles and arcs (exact geometry, 100×100 grid).</p>

<!-- Marks: 100x100 viewBox, single colour (currentColor). -->
<template id="m-blob">

</template>
<template id="m-evidence">

</template>
<template id="m-quarters">

<h3>Wordmark: font comparison (no mark)</h3>
<div class="fonts" id="fonts"></div>

<script>
(function () {
  var MARKS = [
    { id: "lumin1", title: "25 · Lumin: sun-gear", note: "Disc + asymmetric rays upper-right + round nubs lower-left.", tpl: "m-lumin1", style: "lumin" },
    { id: "lumin2", title: "26 · Lumin: notched burst", note: "Wedge cut from a nubbed disc; three long rays leave through it.", tpl: "m-lumin2", style: "lumin" },
    { id: "kimaro1", title: "27 · Kimaro: quarter B", note: "Capital B from a quarter-rounded stem and two quarter discs.", tpl: "m-kimaro1", style: "kimaro" },
    { id: "kimaro2", title: "28 · Kimaro: quarter tile", note: "Abstract 2×2 tile of quarter discs and one square.", tpl: "m-kimaro2", style: "kimaro" },
    { id: "offtop1", title: "29 · Offtop: pebble B", note: "B from two soft pebbles: a stem and a double lobe.", tpl: "m-offtop1", style: "offtop" },
    { id: "offtop2", title: "30 · Offtop: bite", note: "A big pebble with a bite; the small dot is the bite.", tpl: "m-offtop2", style: "offtop" },
  ];
  function mark(tpl) {
    var t = document.getElementById(tpl).content.firstElementChild.cloneNode(true);
    var rays = t.querySelector(".rays");
    if (rays) {
      // 7 rays from 180° to 0°, length ~ gaussian around the vertical one; small gap from the disc.
      for (var i = 0; i < 5; i++) {
        var len = 14 + 52 * Math.exp(-0.5 * Math.pow((i - 2) / 1.0, 2));
        var r0 = 32, cx = 50, cy = 100;
        var g = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        g.setAttribute("x", r0); g.setAttribute("y", -8); g.setAttribute("width", len); g.setAttribute("height", 16); g.setAttribute("rx", 0);
        g.setAttribute("transform", "translate(" + cx + " " + cy + ") rotate(" + (-180 + 180 * i / 4) + ")");
        rays.appendChild(g);
      }
      t.setAttribute("viewBox", "-4 -4 108 104");
    }
    return t;
  }
  var STYLES = { lumin: ["bayesly", "700 1em 'Space Grotesk'", "-0.035em"], kimaro: ["Bayesly", "700 1em 'Inter Tight'", "-0.04em"], offtop: ["Bayesly", "800 1em 'Plus Jakarta Sans'", "-0.045em"] };
  var CURRENT = null;
  function lockup(tpl, word, cls) {
    var st = CURRENT && STYLES[CURRENT];
    var d = document.createElement("div"); d.className = "lockup " + (cls || "");
    d.appendChild(mark(tpl));
    var w = document.createElement("span"); w.className = "word"; w.textContent = st ? st[0] : word;
    if (st) { w.style.font = st[1]; w.style.letterSpacing = st[2]; }
    d.appendChild(w);
    return d;
  }
  var root = document.getElementById("variants");
  MARKS.forEach(function (m) {
    CURRENT = m.style || null;
    var s = document.createElement("section"); s.className = "variant"; s.dataset.id = m.id;
    s.innerHTML = "<h2>" + m.title + "</h2><p>" + m.note + "</p>";
    var row = document.createElement("div"); row.className = "row";
    var t = document.createElement("div"); t.className = "tile lime"; t.appendChild(lockup(m.tpl, "bayesly")); row.appendChild(t);
    var side = document.createElement("div"); side.className = "side";
    var av = document.createElement("div"); av.className = "avatar lime"; av.appendChild(mark(m.tpl)); side.appendChild(av);
    row.appendChild(side); s.appendChild(row);
    var row2 = document.createElement("div"); row2.className = "row"; row2.style.marginTop = "10px";
    var t2 = document.createElement("div"); t2.className = "tile ink"; t2.style.height = "110px"; t2.appendChild(lockup(m.tpl, "bayesly", "sm")); row2.appendChild(t2);
    var tiny = document.createElement("div"); tiny.className = "tiny";
    var sm = lockup(m.tpl, "bayesly"); sm.style.fontSize = "22px"; tiny.appendChild(sm);
    [48, 32, 16].forEach(function (px) { var c = document.createElement("div"); c.className = "c"; c.style.width = c.style.height = px + "px"; c.appendChild(mark(m.tpl)); tiny.appendChild(c); });
    row2.appendChild(tiny); s.appendChild(row2);
    root.appendChild(s);
  });

  var FONTS = [
    ["Inter Tight", 700, "-0.045em", "neutral grotesk (current)"],
    ["Manrope", 800, "-0.05em", "geometric, open"],
    ["Plus Jakarta Sans", 800, "-0.05em", "soft, Offtop-like"],
    ["Sora", 700, "-0.05em", "wide geometric"],
    ["Space Grotesk", 700, "-0.04em", "quirky details, Lumin-like"],
  ];
  var fr = document.getElementById("fonts");
  FONTS.forEach(function (f) {
    var t = document.createElement("div"); t.className = "tile lime";
    t.innerHTML = '<div><div style="font:' + f[1] + ' 64px \'' + f[0] + '\';letter-spacing:' + f[2] + '">bayesly</div><small>' + f[0] + ' ' + f[1] + ' · ' + f[3] + '</small></div>';
    fr.appendChild(t);
  });

  document.fonts.ready.then(function () { document.body.dataset.ready = "1"; });
})();
