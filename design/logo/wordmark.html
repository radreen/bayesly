<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayesly wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0d0d0e; --lime: #c6ff2e; --paper: #e4e4df; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #9d9d98; font-family: "Inter Tight", system-ui, sans-serif; padding: 32px 40px 60px; }
  h1 { font: 800 28px "Inter Tight"; letter-spacing: -0.03em; }
  .note { font: 500 13px "JetBrains Mono", monospace; opacity: .75; margin: 6px 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(760px, 1fr)); gap: 22px; }
  .variant h2 { font: 700 14px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .variant p { font: 500 12px "JetBrains Mono", monospace; opacity: .75; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .tile { width: 400px; height: 220px; display: grid; place-items: center; flex: none; }
  .tile.lime { background: var(--lime); color: var(--ink); }
  .tile.ink { background: var(--ink); color: var(--lime); }
  .tile svg { width: 80%; height: auto; overflow: visible; }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; }
  .avatar svg { width: 60%; height: 60%; overflow: visible; }
  .small { flex: 1; display: flex; gap: 14px; align-items: center; padding: 0 14px; background: var(--paper); color: var(--ink); min-height: 60px; }
  .small svg { overflow: visible; }
  .avatar .swash, .small div .swash { display: none; }
  .wm text { font: 700 200px "Inter Tight"; letter-spacing: -6px; fill: currentColor; }
  .wm .loop { fill: none; stroke: currentColor; stroke-width: 32; stroke-linecap: butt; stroke-linejoin: round; }
</style>
</head>
<body>
<h1>Bayesly — drawn “b” explorations v2</h1>
<p class="note">Only the b is drawn (monoline, 32 = Inter Tight 700 stem @ 200px); “ayesly” is the font. Outline in Figma before production use.</p>

<!--
  Custom b glyphs, local coords: stem centre x=0, baseline y=300, x-height y=190,
  ascender y=154, bowl centreline top 206 / bottom 284. Closing tags are explicit:
  "<path/>" self-closing does not work inside an HTML <template>.
-->
<template id="b-cursive">
  <g data-part data-gap="10"><path class="loop" d="M-34 240 C -6 226, 32 196, 40 170 C 48 140, 22 122, 8 134 C -2 144, 0 172, 0 200 L 0 262 C 0 278, 26 284, 60 284 C 92 284, 112 266, 112 245 C 112 224, 92 206, 62 206 C 36 206, 14 220, 0 236"></path></g>
</template>
<template id="b-drop">
  <g data-part data-gap="10"><path class="loop" d="M0 154 L 0 284 C 52 292, 118 278, 116 238 C 114 202, 66 192, 0 248"></path></g>
</template>
<template id="b-bell">
  <g data-part data-gap="6"><path class="loop" d="M0 154 L 0 284 L 150 284 C 124 284, 110 268, 100 244 C 90 220, 80 206, 64 206 C 48 206, 38 218, 28 236 C 20 250, 12 260, 0 266"></path></g>
</template>
<template id="b-crook">
  <g data-part data-gap="10"><path class="loop" d="M-46 196 C -48 164, -28 150, -12 150 C -2 150, 0 160, 0 176 L 0 284 L 62 284 C 92 284, 112 266, 112 245 C 112 224, 92 206, 64 206 C 36 206, 14 216, 0 232"></path></g>
</template>
<template id="b-open">
  <g data-part data-gap="10"><path class="loop" d="M0 154 L 0 300"></path><path class="loop" d="M0 236 C 14 216, 38 206, 62 206 C 92 206, 114 226, 114 250 C 114 274, 92 292, 62 292 C 50 292, 42 290, 34 287"></path></g>
</template>
<template id="b-knot">
  <g data-part data-gap="10"><path class="loop" d="M0 154 L 0 284 C 30 292, 112 282, 112 245 C 112 210, 72 200, 42 208 C 12 216, -26 240, -46 226 C -62 214, -54 186, -30 186 C -8 186, 0 208, 0 232"></path></g>
</template>

<!-- v3 -->
<template id="b-tail">
  <g data-part data-gap="10"><path class="loop" d="M0 154 L 0 284 C 40 290, 112 282, 112 245 C 112 212, 82 204, 58 206 C 30 208, 2 222, -44 244"></path></g>
</template>
<template id="b-liga">
  <g data-part data-gap="10"><path class="loop" d="M0 154 L 0 300"></path><path class="loop" d="M10 226 C 26 210, 44 206, 62 206 C 92 206, 114 226, 114 248 C 114 270, 96 286, 68 286 L 50 286"></path><path d="M58 250 L 18 286 L 58 322 Z" fill="currentColor"></path></g>
</template>
<template id="b-dot">
  <g data-part data-gap="10"><path class="loop" d="M0 154 L 0 284 L 64 284 C 98 284, 124 268, 124 245 C 124 222, 98 206, 64 206 C 34 206, 12 218, 0 232"></path><circle cx="60" cy="245" r="15" fill="currentColor"></circle></g>
</template>
<template id="b-swash">
  <g data-part data-adv="146"><path class="loop" d="M0 154 L 0 300"></path><path class="loop swash" d="M0 298 L 0 318 C 0 352, 26 372, 72 372 L 420 372"></path><path class="loop" d="M0 232 C 12 218, 34 206, 64 206 C 92 206, 112 224, 112 245 C 112 266, 92 284, 64 284 L 0 284"></path></g>
</template>
<template id="b-lean">
  <g data-part data-gap="10"><path class="loop" d="M-34 150 C -8 172, 0 214, 0 258 C 0 278, 30 284, 62 284 C 92 284, 112 266, 112 245 C 112 224, 92 206, 62 206 C 36 206, 14 220, 0 236"></path></g>
</template>
<template id="b-spiral">
  <g data-part data-gap="10"><path d="M-14 140 L -14 270 L 50 270 C 84 270, 104 252, 104 231 C 104 210, 84 192, 50 192 C 22 192, 2 202, -14 216" fill="none" stroke="currentColor" stroke-width="5"></path><path class="loop" d="M0 154 L 0 284 L 64 284 C 96 284, 116 266, 116 245 C 116 224, 96 206, 64 206 C 34 206, 12 218, 0 232"></path></g>
</template>

<div class="grid" id="variants"></div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var VARIANTS = [
    { id: "cursive", title: "1 · Cursive", note: "Handwritten b: lead-in stroke, loop at the top of the stem.", tpl: "b-cursive" },
    { id: "drop",    title: "2 · Drop", note: "Bowl closes into the stem diagonally; the counter is a drop.", tpl: "b-drop" },
    { id: "bell",    title: "3 · Bell", note: "Bowl is a bell curve on a baseline: the Bayes nod.", tpl: "b-bell" },
    { id: "crook",   title: "4 · Crook", note: "Stem starts with a curled hook; friendly, compact.", tpl: "b-crook" },
    { id: "open",    title: "5 · Open", note: "Bowl stops short of the stem: an update in progress.", tpl: "b-open" },
    { id: "knot",    title: "6 · Knot", note: "The bowl's stroke ties a small loop left of the stem.", tpl: "b-knot" },
    { id: "tail",    title: "7 · Tail", note: "The bowl runs through the stem and exits left as a tail.", tpl: "b-tail" },
    { id: "liga",    title: "8 · Update", note: "The bowl is a refresh arrow returning to the stem: a belief, updated.", tpl: "b-liga" },
    { id: "dot",     title: "9 · Data point", note: "A dot in the counter: one observation, the start of an update.", tpl: "b-dot" },
    { id: "swash",   title: "10 · Underline swash", note: "The stem drops below the baseline and underlines the name.", tpl: "b-swash" },
    { id: "lean",    title: "11 · Lean", note: "The stem starts with a hand-drawn lean, like a pen stroke.", tpl: "b-lean" },
    { id: "spiral",  title: "12 · Echo", note: "A thin prior b behind the bold posterior b.", tpl: "b-spiral" },
  ];
  // Show the newest set first.
  VARIANTS = VARIANTS.slice(6).concat(VARIANTS.slice(0, 6));

  function wordmark(tpl, withText) {
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "wm");
    svg.innerHTML = document.getElementById(tpl).innerHTML + (withText ? '<text data-part y="300">ayesly</text>' : "");
    return svg;
  }

  function layout(svg) {
    var x = null;
    svg.querySelectorAll("[data-part]").forEach(function (el) {
      if (el.tagName === "text") {
        el.setAttribute("x", x);
      } else {
        // First (and only) drawn letter: next text starts after its ink + gap,
        // or at a fixed advance for letters whose strokes run under/into the text.
        var bb = el.getBBox();
        x = el.dataset.adv ? Number(el.dataset.adv) : bb.x + bb.width + 16 + Number(el.dataset.gap || 8);
      }
    });
    var bb = svg.getBBox(), pad = 20; // getBBox ignores stroke width
    svg.setAttribute("viewBox", [bb.x - pad, bb.y - pad, bb.width + pad * 2, bb.height + pad * 2].join(" "));
  }

  var root = document.getElementById("variants");
  VARIANTS.forEach(function (v) {
    var sec = document.createElement("section");
    sec.className = "variant"; sec.dataset.id = v.id;
    sec.innerHTML = "<h2>" + v.title + "</h2><p>" + v.note + "</p><div class='row'></div>";
    var row = sec.querySelector(".row");
    var t1 = document.createElement("div"); t1.className = "tile lime"; t1.appendChild(wordmark(v.tpl, true)); row.appendChild(t1);
    var side = document.createElement("div"); side.className = "side";
    var av = document.createElement("div"); av.className = "avatar"; av.appendChild(wordmark(v.tpl, false)); side.appendChild(av);
    row.appendChild(side);
    sec.appendChild(row);
    var row2 = document.createElement("div"); row2.className = "row"; row2.style.marginTop = "10px";
    var t2 = document.createElement("div"); t2.className = "tile ink"; t2.style.height = "120px"; t2.appendChild(wordmark(v.tpl, true)); row2.appendChild(t2);
    var small = document.createElement("div"); small.className = "small";
    [150, 90, 50].forEach(function (w) { var s = wordmark(v.tpl, true); s.style.width = w + "px"; small.appendChild(s); });
    [32, 16].forEach(function (w) {
      var d = document.createElement("div");
      d.style.cssText = "width:" + w + "px;height:" + w + "px;border-radius:50%;background:var(--lime);display:grid;place-items:center";
      var s = wordmark(v.tpl, false); s.style.width = "62%"; s.style.height = "62%"; d.appendChild(s); small.appendChild(d);
    });
    row2.appendChild(small);
    sec.appendChild(row2);
    root.appendChild(sec);
  });

  document.fonts.ready.then(function () {
    document.querySelectorAll("svg.wm").forEach(layout);
    document.body.dataset.ready = "1";
  });
})();
</script>
</body>
</html>
