<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayesly post templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bayesly.css">
<style>
body { background: #9d9d98; }
/* ================= Gallery chrome (not part of posts) ================= */
.gallery-head { padding: 32px 40px 0; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
.gallery-head h1 { font-weight: 800; font-size: 28px; letter-spacing: -0.03em; }
.gallery-head p { font: 500 13px var(--mono); opacity: .75; width: 100%; }
.toggle { display: flex; gap: 8px; }
.toggle button { font: 600 14px "Inter Tight"; padding: 8px 16px; border-radius: 999px; border: 2px solid var(--ink); background: transparent; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
.section-title { padding: 34px 40px 0; font: 700 13px var(--mono); text-transform: uppercase; letter-spacing: .1em; }
.grid { display: flex; flex-wrap: wrap; gap: 28px; padding: 16px 40px 20px; }
.grid.carousel { gap: 0; }
.frame { width: calc(1080px * var(--s)); }
.frame .holder { width: calc(1080px * var(--s)); height: calc(1350px * var(--s)); overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.22); }
.frame .holder > .post { transform: scale(var(--s)); transform-origin: 0 0; }
.frame figcaption { margin-top: 12px; padding-right: 14px; font: 500 12px/1.4 var(--mono); }
.frame figcaption b { font: 700 14px "Inter Tight"; display: block; }

/* Export mode: ?slide=<id> shows one post at 1:1 for screenshots */
body.export { background: transparent; }
body.export .gallery-head, body.export .section-title, body.export figcaption { display: none; }
body.export .grid { padding: 0; }
body.export .frame { display: none; width: auto; }
body.export .frame.show { display: block; }
body.export .frame .holder { width: 1080px; height: 1350px; box-shadow: none; }
body.export .frame .holder > .post { transform: none; }

</style>
</head>
<body>

<!-- Shared SVG defs (patterns referenced by all slides) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="dots-ink" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.6" fill="#0d0d0e"/></pattern>
  </defs>
</svg>

<header class="gallery-head">
  <h1>Bayesly — post templates v0.2</h1>
  <div class="toggle" role="group" aria-label="Accent colour">
    <button data-pal="lime" aria-pressed="true">Lime (brand)</button>
    <button data-pal="blue" aria-pressed="false">Blue (reference)</button>
  </div>
  <p>1080×1350 (4:5) · sample copy is fictional (Example Lab, ExampleTool) · export one: ?slide=cover&amp;palette=blue · facts = grotesk, opinion = serif italic</p>
</header>

<h2 class="section-title">Carousel — swipe order (ruler runs across slides)</h2>
<main class="grid carousel">

<!-- 01 COVER -->
<figure class="frame" data-id="cover">
<div class="holder"><article class="post ink cover">
  <svg class="art" viewBox="0 0 1080 1350" aria-hidden="true">
    <path class="bell-prior" data-bell="400,290,250,1192" style="color:var(--white)"/>
    <path class="bell-fill" data-bell="760,150,440,1192" data-closed/>
    <path class="bell-dots" data-bell="760,150,440,1192" data-closed/>
    <g class="anno" style="color:var(--white)">
      <line x1="232" y1="1010" x2="232" y2="924"/><circle cx="232" cy="1010" r="6"/>
      <text x="246" y="934">Prior · what we assumed</text>
    </g>
    <g class="anno" style="color:var(--white)">
      <line x1="912" y1="900" x2="984" y2="900"/><circle cx="912" cy="900" r="6"/>
      <text x="912" y="874" text-anchor="start">Posterior</text>
    </g>
  </svg>
  <div class="top"><div class="wordmark">bayesly<i></i></div><span class="pill">Models</span></div>
  <div class="meta"><span>N°045</span><span>06.11.2026</span><span>Src: primary</span></div>
  <div class="content z">
    <h2 class="h-xl">Example Lab releases a <span class="hl">7B open-weights</span> model</h2>
    <p class="lede"><span class="serif">What changed — and how sure we are.</span></p>
  </div>
  <div class="arrow"><svg viewBox="0 0 100 100"><path d="M24 24 L76 76"/><path d="M76 34 L76 76 L34 76"/></svg></div>
  <div class="ruler"><div class="t1"></div><div class="t2"></div><div class="dot"></div><div class="lbl">01 · What happened</div></div>
  <div class="bottom"><span>Source: example.com</span><span>Swipe →</span></div>
</article></div>
<figcaption><b>01 · Cover</b>Headline + prior/posterior curves: the brand device.</figcaption>
</figure>

<!-- 02 UPDATE -->
<figure class="frame" data-id="update">
<div class="holder"><article class="post paper grid-bg update">
  <div class="top"><div class="wordmark">bayesly<i></i></div><span class="pill">The update</span></div>
  <div class="vlabel">Fig. 02 — Belief update</div>
  <div class="content">
    <div class="before">
      <span class="pill">Before</span>
      <p>Open models this size trailed closed ones on coding tasks.</p>
    </div>
    <div class="delta"><div class="stem"></div><span><b>Δ</b>New evidence</span></div>
    <div class="now">
      <div class="halftone"></div>
      <span class="pill fill">Now</span>
      <p>The lab reports it matches a closed model twice its size.</p>
    </div>
    <div class="conf"><span>Confidence</span><span class="dots"><span class="on"></span><span class="on"></span><span></span></span><span>Medium — vendor benchmark only</span></div>
  </div>
  <div class="ruler"><div class="t1"></div><div class="t2"></div><div class="dot"></div><div class="lbl">02 · Before → Now</div></div>
  <div class="bottom"><span>Source: example.com</span><span>02 / 05</span></div>
</article></div>
<figcaption><b>02 · Before → Now</b>Old belief struck through, Δ evidence, new state.</figcaption>
</figure>

<!-- 03 BIG NUMBER -->
<figure class="frame" data-id="number">
<div class="holder"><article class="post acc number">
  <svg class="art" viewBox="0 0 1080 1350" aria-hidden="true">
    <path class="bell-ink" d="M0 850 C 300 830, 560 760, 760 800 S 1000 860, 1080 820 L1080 1350 L0 1350 Z"/>
  </svg>
  <div class="top"><div class="wordmark">bayesly<i></i></div><span class="pill">By the numbers</span></div>
  <div class="content z">
    <div class="bigwrap"><div class="big echo">2×</div><div class="big">2×<sup class="fn">1</sup></div></div>
    <p class="h-m cap">smaller than the closed model it is compared with.</p>
  </div>
  <div class="take">
    <p class="kicker">Our take — opinion</p>
    <p class="quote">“A vendor benchmark is a claim, not a result. We'll wait for independent evals.”</p>
  </div>
  <div class="footnote">¹ Vendor-reported. Not independently verified.</div>
  <div class="ruler" style="color:var(--white)"><div class="t1"></div><div class="t2"></div><div class="dot"></div><div class="lbl">03 · The number</div></div>
  <div class="bottom"><span>Source: example.com</span><span>03 / 05</span></div>
</article></div>
<figcaption><b>03 · Big number</b>Echo outline, footnote marker, opinion in serif.</figcaption>
</figure>

<!-- 04 CONFIDENCE -->
<figure class="frame" data-id="confidence">
<div class="holder"><article class="post ink confidence">
  <div class="top"><div class="wordmark">bayesly<i></i></div><span class="pill">Confidence</span></div>
  <div class="content">
    <h2 class="h-xl">How sure<br>are we?</h2>
    <div class="gauge-row">
      <svg class="gauge" viewBox="0 0 520 300" aria-hidden="true">
        <!-- centre (260,270), r=220; zones 180-120 / 120-60 / 60-0 degrees -->
        <path class="zone off" d="M40 270 A220 220 0 0 1 150 79.5"/>
        <path class="zone on"  d="M154 77.3 A220 220 0 0 1 366 77.3"/>
        <path class="zone off" d="M370 79.5 A220 220 0 0 1 480 270"/>
        <g class="ticks"></g>
        <line class="needle" x1="260" y1="270" x2="305" y2="117"/>
        <circle class="hub" cx="260" cy="270" r="14"/>
        <text x="40" y="298">LOW</text><text x="260" y="22" text-anchor="middle">MEDIUM</text><text x="480" y="298" text-anchor="end">HIGH</text>
      </svg>
      <div class="readout">
        <div class="k">Reading</div>
        <div class="v">Medium</div>
        <div class="r">Strong source, weak proof.</div>
      </div>
    </div>
    <div class="rows">
      <div class="row for"><div class="sign">+</div><div class="bar">The lab's own release notes<small>Primary</small></div></div>
      <div class="row against"><div class="sign">−</div><div class="bar">Benchmarks are self-reported<small>Unverified</small></div></div>
      <div class="row against"><div class="sign">−</div><div class="bar">No independent replication<small>Pending</small></div></div>
    </div>
  </div>
  <div class="ruler"><div class="t1"></div><div class="t2"></div><div class="dot"></div><div class="lbl">04 · How sure</div></div>
  <div class="bottom"><span>Source: example.com</span><span>04 / 05</span></div>
</article></div>
<figcaption><b>04 · Confidence</b>Instrument dial + evidence ledger (+ / −).</figcaption>
</figure>

<!-- 05 WE DON'T KNOW YET -->
<figure class="frame" data-id="unknown">
<div class="holder"><article class="post ink unknown">
  <div class="top"><div class="wordmark">bayesly<i></i></div><span class="pill">Open question</span></div>
  <div class="content">
    <h2 class="h-xxl">We don't<br>know <span class="serif">yet.</span></h2>
    <div class="flat">
      <svg viewBox="0 0 936 120" aria-hidden="true">
        <g class="uniform"></g>
        <line x1="0" y1="118" x2="936" y2="118" stroke="var(--white)" stroke-width="2" opacity=".6"/>
        <text x="0" y="22" style="font:700 17px var(--mono);letter-spacing:1.6px;fill:var(--accent)">FLAT PRIOR · EVERY OUTCOME EQUALLY LIKELY</text>
      </svg>
    </div>
    <div class="q">
      <p class="kicker">What would change our mind</p>
      <ul>
        <li>Independent evals on public benchmarks</li>
        <li>Usage reports from outside the lab</li>
      </ul>
    </div>
  </div>
  <div class="ruler"><div class="t1"></div><div class="t2"></div><div class="dot"></div><div class="lbl">05 · What's next</div></div>
  <div class="bottom"><span>Follow for the update</span><span>05 / 05</span></div>
</article></div>
<figcaption><b>05 · We don't know yet</b>Flat prior = honest uncertainty. Checklist of what would change our mind.</figcaption>
</figure>

</main>

<h2 class="section-title">Singles</h2>
<section class="grid">

<!-- 06 TESTED -->
<figure class="frame" data-id="tested">
<div class="holder"><article class="post paper grid-bg tested">
  <div class="top"><div class="wordmark">bayesly<i></i></div><span class="pill solid-ink">Weekly rubric</span></div>
  <div class="meta"><span>Lab report</span><span>Tool: ExampleTool</span><span>Not sponsored</span></div>
  <div class="content">
    <div class="title"><h2 class="h-xxl"><span class="hl">Tested</span></h2><div class="no">01</div></div>
    <p class="sub">We tried it by hand, so you don't have to.</p>
    <table>
      <tr><td class="k"><span>01</span>Claim</td><td class="v">ExampleTool summarises a 40-page PDF in under a minute.</td></tr>
      <tr><td class="k"><span>02</span>What we tried</td><td class="v">Three real reports, same prompt, timed by hand.</td></tr>
      <tr><td class="k"><span>03</span>Result</td><td class="v">2 of 3 under a minute. One summary skipped a key table.</td></tr>
    </table>
  </div>
  <div class="verdict"><span class="lbl">Verdict</span><span class="pill">Worth it</span><span class="pill pick">Wait</span><span class="pill">Skip</span></div>
  <div class="stamp"><div class="badge" data-text="Tested by Bayesly · not sponsored · "></div><div class="disc">WAIT</div></div>
  <div class="bottom"><span>Method in the newsletter</span><span>No. 01</span></div>
</article></div>
<figcaption><b>06 · Tested</b>Lab-report table + rubber stamp verdict.</figcaption>
</figure>

<!-- 07 WEEKLY DIGEST -->
<figure class="frame" data-id="digest">
<div class="holder"><article class="post paper grid-bg digest">
  <div class="wk">45</div>
  <div class="top"><div class="wordmark">bayesly<i></i></div><span class="pill">Week 45 · 2026</span></div>
  <div class="content">
    <h2 class="h-xl">This week,<br><span class="hl-ink">5 updates</span></h2>
    <ol>
      <li><span class="n">01</span><span><span class="c">Models</span><span class="t">Example Lab releases a 7B open model</span></span><span class="conf">Med<span class="dots"><span class="on"></span><span class="on"></span><span></span></span></span></li>
      <li><span class="n">02</span><span><span class="c">Infra</span><span class="t">ExampleCloud adds GPU sharing for inference</span></span><span class="conf">High<span class="dots"><span class="on"></span><span class="on"></span><span class="on"></span></span></span></li>
      <li><span class="n">03</span><span><span class="c">Research · preprint</span><span class="t">LLMs can imitate an author's style</span></span><span class="conf">Low<span class="dots"><span class="on"></span><span></span><span></span></span></span></li>
      <li><span class="n">04</span><span><span class="c">Tested</span><span class="t">ExampleTool: verdict “Wait”</span></span><span class="conf"><span class="tag">Tested</span></span></li>
      <li><span class="n">05</span><span><span class="c">Benchmarks</span><span class="t">A new long-context benchmark appears</span></span><span class="conf">Med<span class="dots"><span class="on"></span><span class="on"></span><span></span></span></span></li>
    </ol>
  </div>
  <div class="bottom"><span>Full digest: newsletter</span><span>bayesly</span></div>
</article></div>
<figcaption><b>07 · Weekly digest</b>Category + confidence per item, outlined week number.</figcaption>
</figure>

<!-- 08 CTA -->
<figure class="frame" data-id="cta">
<div class="holder"><article class="post acc cta">
  <svg class="art" viewBox="0 0 1080 1350" aria-hidden="true">
    <path class="bell-ink" data-bell="940,120,210,900" data-closed data-floor="1350"/>
    <rect class="bell-ink" x="0" y="899" width="1080" height="451"/>
  </svg>
  <div class="top"><div class="wordmark">bayesly<i></i></div></div>
  <div class="content z">
    <h2 class="h-xxl">Before.<br>Now.<br><span class="serif">How sure.</span></h2>
  </div>
  <div class="badge-wrap"><div class="badge" data-text="Update your priors · bayesly · "><div class="center"><div class="arrow"><svg viewBox="0 0 100 100"><path d="M24 24 L76 76"/><path d="M76 34 L76 76 L34 76"/></svg></div></div></div></div>
  <div class="foot">
    <p class="kicker">Calm AI news</p>
    <p class="body">Every post says what changed and how sure we are. No hype.</p>
    <div class="actions"><span class="pill fill">Follow @bayesly</span><span class="pill">What would change your mind?</span></div>
  </div>
  <div class="bottom"><span>bayesly</span><span>Threads · X · Newsletter</span></div>
</article></div>
<figcaption><b>08 · Follow / CTA</b>Brand promise, circular badge, reply prompt.</figcaption>
</figure>

</section>

<script src="logo.js"></script>
<script src="bayesly.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);

  // Palette toggle
  function setPalette(p) {
    document.body.dataset.palette = p;
    document.querySelectorAll(".toggle button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.pal === p));
    });
  }
  document.querySelectorAll(".toggle button").forEach(function (b) {
    b.addEventListener("click", function () { setPalette(b.dataset.pal); });
  });
  setPalette(params.get("palette") === "blue" ? "blue" : "lime");

  // Export mode
  var slide = params.get("slide");
  if (slide) {
    document.body.classList.add("export");
    var f = document.querySelector('.frame[data-id="' + slide + '"]');
    if (f) f.classList.add("show");
  }
})();
</script>
</body>
</html>
