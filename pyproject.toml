[project]
name = "bayesly"
version = "0.0.1"
description = "Bayesly: skeptical AI/tech news drafts (Phase 0, dry-run only)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "feedparser>=6.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["bayesly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
