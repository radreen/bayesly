[project]
name = "bayesly"
version = "0.0.1"
description = "Bayesly: skeptical AI/tech news drafts (dry-run by default; autopost with --live)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "feedparser>=6.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "requests-oauthlib>=1.3",  # X API: OAuth 1.0a user context
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Image rendering. Uses the installed Edge/Chrome; no browser download needed on Windows.
render = ["playwright>=1.45", "yt-dlp>=2026.1.1"]   # yt-dlp: the news' own video clips

[tool.setuptools]
packages = ["bayesly", "bayesly.publish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
