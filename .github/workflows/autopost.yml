# Bayesly autoposting on GitHub Actions.
#
# SAFE BY DEFAULT: runs in dry-run until the repository variable BAYESLY_LIVE is set to "true"
# (Settings -> Secrets and variables -> Actions -> Variables). Kill switch: set BAYESLY_PAUSED=1
# as a variable, send /pause to the Telegram bot, or commit a ci-state/PAUSED file.
#
# State (what was drafted / posted / held) lives in ci-state/ and is committed back after each run,
# so re-runs never double-post. Slide images are re-rendered on demand and never committed.
#
# Rhythm: every 15 min a cheap `check` (RSS + Telegram taps, ~30 s). The heavy autopost (drafting,
# carousel, video) runs only when check says GO: hot fresh story, an approved post, or a long quiet
# spell; capped by MIN_GAP_MINUTES and MAX_POSTS_PER_DAY (bayesly/schedule.py). GitHub may delay or
# drop scheduled runs under load, which is why we tick often instead of at 3 fixed times.

name: autopost

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # check -> autopost only when worth it (off the :00 rush: GitHub drops those)
    - cron: "15 5 * * 1"          # refresh-tokens: weekly (Meta tokens live 60 days)
  workflow_dispatch:
    inputs:
      command:
        description: "check (decides), autopost (forces a post), telegram-sync, refresh-tokens"
        default: check
        type: choice
        options: [check, autopost, telegram-sync, refresh-tokens]
      live:
        description: "REALLY publish this one run (ignores BAYESLY_LIVE; default: dry-run)"
        type: boolean
        default: false
      draft:
        description: "How many NEW drafts to write first (0 = publish from the existing queue)"
        type: string
        default: "3"

permissions:
  contents: write                 # to commit ci-state/ back

concurrency:
  group: bayesly-state            # never two runs writing state at once
  cancel-in-progress: false

env:
  OUT_DIR: ci-state/queue
  STATE_DIR: ci-state
  PLATFORMS: ${{ vars.PLATFORMS || 'threads,instagram,x' }}
  POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
  BAYESLY_PAUSED: ${{ vars.BAYESLY_PAUSED || '0' }}
  VIDEO_PLATFORMS: ${{ vars.VIDEO_PLATFORMS || 'instagram,x' }}   # set to 'none' to switch video off
  VIDEO_VOICE: ${{ vars.VIDEO_VOICE || '1' }}
  MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '8' }}
  MIN_GAP_MINUTES: ${{ vars.MIN_GAP_MINUTES || '60' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
  GEMINI_TIMEOUT_SECONDS: "90"
  HTTP_MAX_RETRIES: "2"
  THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
  THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
  INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
  MEDIA_GITHUB_REPO: ${{ vars.MEDIA_GITHUB_REPO }}
  MEDIA_GITHUB_TOKEN: ${{ secrets.MEDIA_GITHUB_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  LIVE_FLAG: ${{ (vars.BAYESLY_LIVE == 'true' || inputs.live == true) && '--live' || '' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # video render ~2-3 min per post
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pick command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 5 * * 1" ]; then
            echo "name=refresh-tokens" >> "$GITHUB_OUTPUT"
          else
            echo "name=check" >> "$GITHUB_OUTPUT"
          fi

      - name: Install (light)
        run: pip install -e . --quiet

      - name: Check
        id: check
        if: steps.cmd.outputs.name == 'check'
        run: python -m bayesly check $LIVE_FLAG

      - name: Install (render + video)
        if: steps.cmd.outputs.name == 'autopost' || steps.check.outputs.go == 'true'
        run: |
          pip install -e ".[render]" --quiet
          python -m playwright install --with-deps chromium > /dev/null
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Telegram sync
        if: steps.cmd.outputs.name == 'telegram-sync'
        run: |
          if [ -n "$LIVE_FLAG" ]; then python -m bayesly telegram-sync --live; else echo "dry-run: skipping telegram-sync"; fi

      - name: Refresh Meta tokens
        if: steps.cmd.outputs.name == 'refresh-tokens'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}   # fine-grained PAT: this repo, "Secrets: read and write"
        run: |
          if [ -n "$LIVE_FLAG" ]; then python -m bayesly refresh-tokens --live --github-secrets; else echo "dry-run: skipping refresh"; fi

      - name: Autopost
        if: steps.cmd.outputs.name == 'autopost' || steps.check.outputs.go == 'true'
        run: python -m bayesly autopost --draft ${{ inputs.draft || '3' }} $LIVE_FLAG

      - name: Save state
        if: always()
        run: |
          git config user.name "bayesly-bot"
          git config user.email "bayesly-bot@users.noreply.github.com"
          git add ci-state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "state: ${{ steps.cmd.outputs.name }} run ${{ github.run_id }}"
          git pull --rebase --quiet && git push --quiet
